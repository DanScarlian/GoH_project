<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Гильдия героев</title>
  <style>
    @font-face {font-family: 'vinque'; src: url('Vinque.ttf') format('truetype'); font-weight: normal; font-style: normal; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'vinque', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #2C2C2C; background-image: url('images/bg.png'); background-size: cover; background-position: center; background-repeat: no-repeat; color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #A2261E; width: 100%; max-width: 440px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 4px solid #946E10; }
    .progress-bar { width: 100%; height: 6px; background-color: #e2e8f0; border-radius: 999px; margin-bottom: 16px; overflow: hidden; border: 2px solid #2c2c2c;}
    .progress-fill { height: 100%; width: 0%; background-color: #EF0909; transition: width 0.3s ease; }
    .step-counter { font-size: 13px; font-weight: 600; color: #ffffff; margin-bottom: 8px; text-transform: uppercase; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
    h2 { font-size: 19px; font-weight: 700; margin-bottom: 20px; line-height: 1.35; }
    #question-text {color: #ffffff;}
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { width: 100%; text-align: left; padding: 14px 16px; font-size: 15px; color: #1e293b; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; cursor: pointer; }
    .option-btn:active { background: #e0e7ff; border-color: #EF0909; }
    .hidden { display: none; }
    .result-badge { display: inline-block; margin: 0 auto 12px auto; padding: 4px 12px; background: #ffffff; color: #EF0909; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
    .result-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; margin-bottom: 16px; border: 2px solid #2c2c2c;}
    #result-title {text-align: center; }
    .result-desc { font-size: 15px; line-height: 1.6; color: #ffffff; margin-bottom: 24px; text-align: center; }
    .restart-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: #2c2c2c; background: #946E10; border: none; border-radius: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <div id="quiz-screen">
      <div class="progress-bar">
        <div id="progress" class="progress-fill"></div>
      </div>
      <div id="step-counter" class="step-counter"></div>
      <h2 id="question-text"></h2>
      <div id="options-container" class="options"></div>
    </div>

    <div id="result-screen" class="hidden">
      <div class="result-badge">(✧ω✧) вжух (✧ω✧) </div>
      <h2 id="result-title"></h2>
      <img id="result-image" class="result-img hidden" src="" alt="Иллюстрация результата">
      <p id="result-desc" class="result-desc"></p>
      <button class="restart-btn" onclick="restartQuiz()">Хочу еще!</button>
    </div>
  </div>

  <script>
    // ответы
    const results = {
      paladin: {
        title: "Паладин",
        desc: "Оберегай близких тебе и помогай нуждающимся! Да будет твой путь светел",
        image: "images/warrior.png" 
      },
      bard: {
        title: "Бард",
        desc: "Счастье не в конечном результате, а в людях, с которыми его провел",
        image: "images/bard.png"
      },
      alchemy: {
        title: "Алхимик",
        desc: "Трансмутация привычных устоев приводит к невероятным открытиям",
        image: "images/mage.png"
      },
      druid: {
        title: "Друид",
        desc: "Гармония с природой наполняет вас вдохновением и спокойствием",
        image: "images/druid.png"
      },
      rogue: {
        title: "Плут",
        desc: "Вы в гуще событий, берите от них лучшее!",
        image: "images/rogue.png"
      },
    };

    // вопросы
    const questions = [
    //вопрос 1
      {
        text: "С чего начинается ваш идеальный день?",
        options: [
          { text: "С чашечки кофе и составления планов", scores: { alchemy: 2, bard: 0,  paladin: 1, druid: 0, rogue: 1 } },
          { text: "С помощи товарищам", scores: { alchemy: 0, bard: 1,  paladin: 2, druid: 0, rogue: 0 } },
          { text: "Придумываю новые истории", scores: { alchemy: 0, bard: 3,  paladin: 0, druid: 1, rogue: 2 } }
        ]
      },
    //вопрос 2
      {
        text: "Если у команды возникают проблемы:",
        options: [
          { text: "Беру удар на себя", scores: { alchemy: 0, bard: 0,  paladin: 3, druid: 2, rogue: 0 } },
          { text: "Рассказываю шутку и успокаиваю", scores: { alchemy: 0, bard: 3,  paladin: 0, druid: 1, rogue: 2 } },
          { text: "Спокойно ищу решение", scores: { alchemy: 3, bard: 0,  paladin: 0, druid: 0, rogue: 2 } }
        ]
      },
    //вопрос 3
      {
        text: "Если жизнь даёт тебе лимоны:",
        options: [
          { text: "Сварю из них лимонад", scores: { alchemy: 3, bard: 0,  paladin: 0, druid: 0, rogue: 0 } },
          { text: "Продам и разбогатею", scores: { alchemy: 0, bard: 3,  paladin: 0, druid: 0, rogue: 0 } },
          { text: "Узнаю, откуда они взялись и почему оказались здесь", scores: { alchemy: 0, bard: 0,  paladin: 3, druid: 0, rogue: 0 } }
        ]
      },
      //вопрос 4
      {
        text: "Большая лягушка встаёт у тебя на пути",
        options: [
          { text: "Ква, ква?", scores: { alchemy: 1, bard: 2,  paladin: 0, druid: 1, rogue: 3 } },
          { text: "Приму бой!", scores: { alchemy: 0, bard: 0,  paladin: 2, druid: 0, rogue: 3 } },
          { text: "Фрогги, я пришел договориться!", scores: { alchemy: 0, bard: 2,  paladin: 0, druid: 3, rogue: 0 } }
        ]
      },
      //вопрос 5
      {
        text: "Ты приходишь к аудитории по расписанию, но дверь закрыта",
        options: [
          { text: "Можно тихо уйти", scores: { alchemy: 0, bard: 2,  paladin: 0, druid: 0, rogue: 3 } },
          { text: "Ждать...", scores: { alchemy: 0, bard: 2,  paladin: 3, druid: 1, rogue: 0 } },
          { text: "Схожу в деканат и узнаю информацию", scores: { alchemy: 3, bard: 0,  paladin: 3, druid: 2, rogue: 0 } }
        ]
      },
      //вопрос 6
      {
        text: "Загадочный торговец предлагает тебе мистический артефакт",
        options: [
          { text: "Ура, неизвестность!", scores: { alchemy: 2, bard: 3,  paladin: 0, druid: 0, rogue: 2 } },
          { text: "Спросить у него про артефакт", scores: { alchemy: 3, bard: 1,  paladin: 3, druid: 2, rogue: 2 } },
          { text: "Начать торговаться", scores: { alchemy: 1, bard: 2,  paladin: 0, druid: 2, rogue: 3 } }
        ]
      },
      //вопрос 7
      {
        text: "Перед тобой стоит рыцарь и требует извинений",
        options: [
          { text: "Извини", scores: { alchemy: 0, bard: 3,  paladin: 0, druid: 0, rogue: 0 } },
          { text: "Вызываю тебя на дуэль!", scores: { alchemy: 1, bard: 0,  paladin: 3, druid: 1, rogue: 2 } },
          { text: "Узнать, за что извиняться", scores: { alchemy: 3, bard: 0, paladin: 2, druid: 1, rogue: 2 } }
        ]
      },
      //вопрос 8
      {
        text: "7 раз отмерь...",
        options: [
          { text: "1 раз отрежь", scores: { alchemy: 0, bard: 0,  paladin: 3, druid: 2, rogue: 0 } },
          { text: "Все равно криво будет", scores: { alchemy: 0, bard: 3,  paladin: 1, druid: 1, rogue: 3 } },
          { text: "Инженер в соседней комнате", scores: { alchemy: 3, bard: 2,  paladin: 1, druid: 0, rogue: 1 } }
        ]
      },
      //вопрос 9
      {
        text: "Одногруппники приглашают тебя на вечеринку",
        options: [
          { text: "Ура, веселье!", scores: { alchemy: 0, bard: 3,  paladin: 0, druid: 1, rogue: 2 } },
          { text: "Нужно готовиться, завтра пары", scores: { alchemy: 3, bard: 0,  paladin: 2, druid: 1, rogue: 0 } },
          { text: "Нужно быть осторожным и не нарушать правил!", scores: { alchemy: 0, bard: 0,  paladin: 3, druid: 2, rogue: 0 } }
        ]
      },
      //вопрос 10
      {
        text: "Экзамен через две недели",
        options: [
          { text: "Ого, еще целых 13 дней до подготовки", scores: { alchemy: 0, bard: 3,  paladin: 0, druid: 1, rogue: 2 } },
          { text: "Раньше начну готовиться, лучше сдам", scores: { alchemy: 3, bard: 0,  paladin: 2, druid: 1, rogue: 0 } },
          { text: "А может списать? (критический провал)", scores: { alchemy: 1, bard: 2,  paladin: 0, druid: 0, rogue: 3 } }
        ]
      },
      //вопрос 11
      {
        text: "Впереди выходные",
        options: [
          { text: "Самое время прогуляться на природе", scores: { alchemy: 0, bard: 1,  paladin: 2, druid: 3, rogue: 0 } },
          { text: "Пора бы разработать новые проекты", scores: { alchemy: 3, bard: 0,  paladin: 1, druid: 0, rogue: 2 } },
          { text: "С П А Т Ь", scores: { alchemy: 1, bard: 3,  paladin: 0, druid: 1, rogue: 2 } }
        ]
      },
      //вопрос 12
      {
        text: "Что тебе нравится больше?",
        options: [
          { text: "Придумывать игры и приключения", scores: { alchemy: 5, bard: 0,  paladin: 0, druid: 0, rogue: 0 } },
          { text: "Рассчитывать циферки", scores: { alchemy: 2, bard: 0,  paladin: 0, druid: 2, rogue: 3 } },
          { text: "Хочу попробовать всё!", scores: { alchemy: 3, bard: 2,  paladin: 0, druid: 0, rogue: 3 } }
        ]
      },
      //вопрос 13
      {
        text: "А деятельность какая по душе?",
        options: [
          { text: "Рисовать и записывать", scores: { alchemy: 1, bard: 4,  paladin: 0, druid: 2, rogue: 3 } },
          { text: "Помогать и слушать", scores: { alchemy: 2, bard: 1,  paladin: 4, druid: 0, rogue: 3 } },
          { text: "Создавать и улучшать", scores: { alchemy: 4, bard: 0,  paladin: 3, druid: 1, rogue: 2 } }
        ]
      },
      //вопрос 14
      {
        text: "Как настроение?",
        options: [
          { text: "Супер!", scores: { alchemy: 2, bard: 3,  paladin: 1, druid: 2, rogue: 3 } },
          { text: "Тоже хочу делать всякое такое!", scores: { alchemy: 5, bard: 0,  paladin: 0, druid: 3, rogue: 2 } },
          { text: "Еще не разогрелся", scores: { alchemy: 1, bard: 2,  paladin: 0, druid: 1, rogue: 3 } }
        ]
      },
      //вопрос 15
      {
        text: "Большая лягушка дарует вам загадочную сферу",
        options: [
          { text: "Внимательно изучить её", scores: { alchemy: 4, bard: 0,  paladin: 2, druid: 3, rogue: 1 } },
          { text: "Попытаться вскрыть", scores: { alchemy: 3, bard: 2,  paladin: 0, druid: 1, rogue: 4 } },
          { text: "Поблагодарить", scores: { alchemy: 0, bard: 2,  paladin: 3, druid: 4, rogue: 0 } }
        ]
      },
    ];

    
    let currentIndex = 0;
    const scores = {};

    function initScores() {
      Object.keys(results).forEach(k => scores[k] = 0);
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById("step-counter").innerText = `Вопрос ${currentIndex + 1} из ${questions.length}`;
      document.getElementById("question-text").innerText = q.text;
      document.getElementById("progress").style.width = `${(currentIndex / questions.length) * 100}%`;

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.text;
        btn.onclick = () => {
          for (let k in opt.scores) {
            if (scores[k] !== undefined) scores[k] += opt.scores[k];
          }
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResult();
          }
        };
        container.appendChild(btn);
      });
    }

    function showResult() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");

      let winner = Object.keys(scores)[0];
      for (let k in scores) {
        if (scores[k] > scores[winner]) winner = k;
      }

      const res = results[winner];
      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-desc").innerText = res.desc;

      const imgEl = document.getElementById("result-image");
      if (res.image) {
        imgEl.src = res.image;
        imgEl.classList.remove("hidden");
      } else {
        imgEl.classList.add("hidden");
      }
    }

    function restartQuiz() {
      currentIndex = 0;
      initScores();
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      renderQuestion();
    }

    initScores();
    renderQuestion();
  </script>
</body>
</html>
